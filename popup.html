<!DOCTYPE html>
<html>
<head>
<title>Auto Collector Features</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="button-container">
  <button class="button">
    <div class="button-content">
      <div class="icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon" class="w-5 h-5 icon-svg"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"></path></svg>
      </div>
      <div class="text-container">
        <h3 class="button-title">Auto Collector</h3>
        <p class="button-subtitle">Auto-collect shards for 10m</p>
      </div>
    </div>
    <div class="shard-info emerald"><div class="shard-dot" style="background-color: #10B981;"></div>15.000 shards</div>
  </button>

  <button class="button">
    <div class="button-content">
      <div class="icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon" class="w-5 h-5 icon-svg"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18 9 11.25l4.306 4.306a11.95 11.95 0 0 1 5.814-5.518l2.74-1.22m0 0-5.94-2.281m5.94 2.28-2.28 5.941"></path></svg>
      </div>
      <div class="text-container">
        <h3 class="button-title">Shard Multiplier</h3>
        <p class="button-subtitle">2.5x shard values for 10m</p>
      </div>
    </div>
    <div class="shard-info amber"><div class="shard-dot" style="background-color: #F59E0B;"></div>10.000 shards</div>
  </button>

  <button class="button">
    <div class="button-content">
      <div class="icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon" class="w-5 h-5 icon-svg"><path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z"></path></svg>
      </div>
      <div class="text-container">
        <h3 class="button-title">Conveyor Booster</h3>
        <p class="button-subtitle">2.5x shard spawn rate for 10m</p>
      </div>
    </div>
    <div class="shard-info blue"><div class="shard-dot" style="background-color: #3B82F6;"></div>10.000 shards</div>
  </button>

  <button class="gradient-button">Start Refining</button>
</div>

</body>
</html>
